<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annapurna : The Holistic Journey to Balance</title>
</head>
    <style>
        body {
            background-color:#1e453e;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-size: cover;
        }
        .video-background
        {
            position: fixed;
            width: 100vw; /* Full viewport width */
            height: 100vh; /* Full viewport height */
            object-fit: cover; /* Ensures the video covers the viewport without distortion */
            z-index: -1; /* Optional: Places the video behind other content */
        }
        .signin {
            height: 500px;
            width: 900px;
            background-color: rgba(242, 239, 235, 0.9); /* Semi-transparent background */
            border-radius: 2.5%;
            position: absolute;
            margin: auto;
            top: 150px;
            backdrop-filter: blur(1px); /* Apply blur for glassmorphism */
            border: 2px solid rgba(255, 255, 255, 0.2); /* Light border */
        }

        .signin h1{
           color: #1e453e;
           font-family: Arial, sans-serif;
           font-size:45px;
           margin-left: 520px;
           margin-top: 80px;
        }

        .picture
        {
            width:800px;
            height: 800px;
            display: flex;
            position: relative;
            left: -140px;
            top : -180px;
            z-index: 0;
        }
        input[type=password],input[type=email] {
            border: none;
            border-bottom: none;
            padding: 1.0em;
            background-color:#F2EFEB;
            flex-grow: 1;
            outline: none;
            font-size:12px;
            z-index: 5;
        }
        input[type=password],input[type=email]:focus{
            color:#1e453e;
        }
        input[type="password"]:focus::placeholder {
            color: black;
        }
        input[type="email"]:focus::placeholder {
            color: black;
        }
        input[type=submit]{
            background-color:#1e453e;
            border: none;
            color: white;
            padding: 16px 32px;
            text-decoration: none;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 2.5%;
            font-size: 12px;
            margin-right : 200px;
            z-index: 100;
            position: relative;
        }
        .container
        {
            display: flex;
            margin-left : 520px;
            text-align: center;
            align-items: center;
            margin-top: -750px;
            z-index: 7;
        }
        .mail {
            display: flex;
            align-items: center;
            width : 300px;
            border-bottom: 1px solid black;
        }

        .password {
            display: flex;
            align-items: center;
            width : 300px;
            border-bottom: 1px solid black;
        }
        .cbox {
            display: flex;
            margin-top : 15px;
            margin-right: 35px;
            z-index: 100;
            position: relative;
        }
        .r p {
            font-size: 12px; /* Set font size */
            display: flex;
            margin: 3px;

        }
        .picture
        {
            display: flex;
            margin-right: 445px;
            margin-top: -120px;
        }
        .linktosignup u
        {
            margin-top : 380px;
            display: inline-block;
            cursor: pointer;
            position: relative;
            left : -100px;
            top : -160px;
            font-size: 13px;
            color: #000;
            white-space: nowrap;
            z-index: 100;
            text-decoration: none;
        }
    </style>
    <body>
        <div class="video-background">
            <video autoplay muted loop class="background-video">
                <source src="../static/videos/evergreen.mp4" type="video/mp4">
            </video>
        </div>
        <div class="signin">
            <h1>Sign In</h1>
            <div class="picture">
                <img src="../static/images/2024.png" alt="Picture"></img>
            </div>
            <div class="container">
                <form action="/login" method="POST">
                    <div class="mail">
                        <div class="logo">
                            <img src="../static/images/2.png" style="width:35px" , "height:35px">
                        </div>
                            <input type="email" id="mail" name="mail" placeholder="Email" required>
                            <hr style="border-top: 1px solid black;">
                            <br><br>
                    </div>
                    <br>
                    <div class="password">
                        <div class="logo">
                            <img src="../static/images/3.png" style="width:35px" , "height:35px">
                        </div>
                            <input type="password" id="password" name="password" placeholder="Password" required>
                            <hr style="border-top: 1px solid black;">
                            <br><br>
                    </div>
                    <br>
                    <div class="cbox">
                        <input type="checkbox" required class="checkbox">
                        <div class="r">
                            <p>Remember me</p>
                        </div>
                    </div>
                    <br>
                <input type="submit" value="Log In">
                </form>
                <div class="linktosignup">
                    <a href="{{ url_for('signup')}}">
                        <u>Create an account?</u>
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
